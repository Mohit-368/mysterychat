services:

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: mysterychat-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped


  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    container_name: mysterychat-backend

    ports:
      - "5000:5000"

    environment:
      NODE_ENV: production
      PORT: 5000

      MONGO_URI: ${MONGO_URI}
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${CLIENT_URL}

    restart: unless-stopped
